# Five days, in minutes.
minimumReleaseAge: 7200
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
packages:
  - apps/*
  - packages/*
overrides:
  # GHSA-3g3m-2fjr-6pw4; remove when rimraf adopts patched glob.
  "rimraf@6.1.3>glob": "14.0.3"
  # GHSA-g3hv-75wg-m249; remove as each parent adopts minimatch 11.
  "@typescript-eslint/typescript-estree@8.72.1>minimatch": "11.0.4"
  "eslint@10.14.0>minimatch": "11.0.4"
  "@eslint/config-array@0.23.5>minimatch": "11.0.4"
