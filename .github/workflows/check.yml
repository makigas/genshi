name: "Check codebase"

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: jdx/mise-action@v5.2.7
      - run: pnpm install
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build
