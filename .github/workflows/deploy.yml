name: "Deploy to GitHub Pages"

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: jdx/mise-action@v5.2.7
      - run: pnpm install
      - run: pnpm run docs
      - uses: actions/upload-pages-artifact@v5.0.0
        id: deployment
        with:
          path: apps/docs/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
