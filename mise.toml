[tools]
node = "24"
pnpm = "latest"

[tasks."css:build"]
run = "pnpm --filter @makigas/genshi run build"

[tasks."css:watch"]
depends = ["css:build"]
run = "pnpm --filter @makigas/genshi run watch"

[tasks."svelte:build"]
hide = true
run = "pnpm --filter @makigas/genshi-svelte run build"

[tasks."docs:build"]
alias = "docs"
depends = ["css:build", "svelte:build"]
run = "pnpm --filter @makigas/genshi-docs run build"

[tasks."docs:serve"]
depends = ["css:build", "svelte:build"]
hide = true
run = "pnpm --filter @makigas/genshi-docs run dev"

[tasks."docs:dev"]
depends = ["css:watch", "docs:serve"]

[tasks."docs:preview"]
run = "pnpm --filter @makigas/genshi-docs run preview"
